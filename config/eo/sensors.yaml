    operational_status_in_ea_forests: adapter_ready
    verified: {method: "EE query: ee.ImageCollection filterBounds(Uganda point) -> non-empty", date: "2026-09-08"}
    notes: >
      GEDI resumed ISS operations 2024-04-26 after 2023-03-17..2024-04-24
      hibernation; Version 3 products released 2026-07. Preserve the full RH10
      ... RH100 trajectory, not just RH98/RH100. GEDI-derived structure is
