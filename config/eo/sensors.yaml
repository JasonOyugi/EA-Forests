    sensor: L-SAR
    product: L1B (SLC) / L2 (detected, geocoded)
    processing_level: per CONAE product spec
    native_support_m: "mode-dependent (StripMap ~10m class; TOPSAR wider swath, coarser)"
    polarizations: [full-pol and dual-pol modes available depending on acquisition]
    provider: external (CONAE catalogue; ESA PUMAS AO for the international science community)
    access_method: adapter_only_external
    licence: restricted -- registration/approval required
    commercial_use_constraints: "not established for our use case; must be confirmed with CONAE/ESA before any commercial application"
    registration_required: true (CONAE user registry, or ESA/CONAE PUMAS Announcement of Opportunity)
    operational_status_in_ea_forests: blocked_pending_access
    verified:
      method: "web search (2026-09-08): CONAE catalogue (catalogos.conae.gov.ar) requires login; ESA/CONAE PUMAS AO for international science-community access had a submission deadline extended to 2025-11-28 -- status of a NEW/rolling application window not confirmed."
      caveat: "Uganda/Tanzania coverage history, exact product types actually acquired over East Africa, and current AO application availability were NOT independently confirmed -- this entry documents the access boundary, not confirmed in-hand data."
    notes: >
      Treat as a potentially valuable L-band source, NOT interchangeable with
      NISAR/ALOS-2 merely because both are L-band (different modes,
      calibration, revisit, and access terms). Do not let this block the rest
      of the programme -- proceed with NISAR/ALOS-2 first.

