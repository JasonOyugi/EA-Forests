  # --- C-band SAR: Sentinel-1 ------------------------------------------------
  - id: sentinel1-grd
    mission: Sentinel-1
    sensor: C-SAR
    product: S1_GRD (IW mode, analysis-ready)
    processing_level: Ground Range Detected, radiometrically/terrain-uncorrected as delivered by EE (calibrated sigma0)
    native_support_m: 10 (IW GRD, resampled from ~5x20m slant range)
    polarizations: [VV, VH where dual-pol scenes exist]
    acquisition_geometry_fields: [orbitProperties_pass (ascending/descending), relativeOrbitNumber_start, resolution_meters, instrumentMode, transmitterReceiverPolarisation]
    qa: [border noise removal + thermal noise removal already applied by EE ingestion; no cloud QA (radar)]
    provider: google_earth_engine
    access_method: earth_engine_collection
    collection_id: COPERNICUS/S1_GRD
    licence: open (Copernicus)
    registration_required: false
    operational_status_in_ea_forests: adapter_ready
    recipe_key: null
    verified: {method: "EE query: ee.ImageCollection filterBounds(Uganda point) -> non-empty", date: "2026-09-08"}
    notes: >
      Do not mix ascending/descending or incompatible relative orbits into one
      physical time series (Track A2) -- group by (orbit direction, relative
      orbit) into homogeneous streams before any temporal analysis.

  - id: sentinel1-slc
    mission: Sentinel-1
    sensor: C-SAR
    product: S1_SLC
    processing_level: Single Look Complex (phase-preserving)
    native_support_m: "~5 x 20 (range x azimuth, IW)"
    polarizations: [VV, VH where dual-pol]
    acquisition_geometry_fields: [orbit pass, relative orbit, burst/swath geometry, baseline]
    qa: [none built-in; coherence pair selection is the analyst's responsibility]
    provider: external (Copernicus Data Space Ecosystem / ASF)
    access_method: adapter_only_external
    licence: open (Copernicus)
    registration_required: true (Copernicus Data Space Ecosystem account, free)
    operational_status_in_ea_forests: adapter_only_external
    verified: {method: "not verified on Earth Engine; EE only serves pre-processed GRD, not SLC -- SLC requires direct Copernicus Data Space Ecosystem or ASF access", date: "2026-09-08"}
    notes: >
      Needed only where coherence/phase analysis is scientifically justified
      (Track B). Pair selection must match orbit, geometry and temporal
      baseline carefully -- never compute coherence from arbitrary scene pairs.

