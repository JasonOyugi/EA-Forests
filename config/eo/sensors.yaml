# Canonical EO sensor/product registry (Uganda/Tanzania multi-sensor physics
# observatory, Track A + Track B). Config-driven: sensor semantics (bands,
# native support, geometry fields, access method) live HERE, not scattered
# through service code. A provider adapter reads this registry; it does not
# redefine sensor facts inline.
#
# `operational_status_in_ea_forests` values used below:
#   operational              -- implemented, running in production (S2 only)
#   adapter_ready            -- product verified reachable through our
#                                existing Earth Engine connection (project
#                                ee-oyugijason); no new credentials needed;
#                                not yet wired into a recipe/pipeline
#   adapter_only_external     -- requires a NEW access path (not Earth Engine)
#                                that we have not built; documented boundary
#                                only, per docs/eo/ACCESS_REQUIREMENTS.md
#   blocked_pending_access    -- requires registration/approval we do not yet
#                                hold; do not let this block the rest of the
#                                programme
#   monitoring_release        -- mission is real and partly operational, but
#                                the specific product we need is still being
#                                phased in by the provider
#
# Every `verified` field records HOW availability was checked and WHEN, per
# the instruction to verify current catalogue/product/access status rather
# than assume it from mission existence. "EE query" = a live
# ee.ImageCollection(...).filterBounds(Uganda point).size().getInfo() call
# against ee-oyugijason; "web search" = a live search against provider
# documentation on the date shown, cited in docs/eo/ACCESS_REQUIREMENTS.md.

schema_version: "eo-sensor-registry/0.1"
updated: "2026-09-08"

products:
  # --- optical: Sentinel-2 (operational) -----------------------------------
  - id: sentinel2-l2a-sr
    mission: Sentinel-2
    sensor: MSI
    product: S2_SR_HARMONIZED
    processing_level: L2A (surface reflectance, harmonized baseline)
    native_support_m: {B2: 10, B3: 10, B4: 10, B8: 10, B5: 20, B6: 20, B7: 20, B8A: 20, B11: 20, B12: 20, SCL: 20}
    bands:
      - {name: B2, role: blue}
      - {name: B3, role: green}
      - {name: B4, role: red}
      - {name: B5, role: red_edge_1}
      - {name: B6, role: red_edge_2}
      - {name: B7, role: red_edge_3}
      - {name: B8, role: nir}
      - {name: B8A, role: narrow_nir}
      - {name: B11, role: swir_1}
      - {name: B12, role: swir_2}
      - {name: SCL, role: scene_classification_qa}
    acquisition_geometry_fields: [sensing_start, sensing_end, MGRS_TILE, CLOUDY_PIXEL_PERCENTAGE, PROCESSING_BASELINE, sun_azimuth, sun_zenith]
    qa: [SCL scene classification (used for s2-qa-scl-core/1), CLOUDY_PIXEL_PERCENTAGE]
    provider: google_earth_engine
    access_method: earth_engine_collection
    collection_id: COPERNICUS/S2_SR_HARMONIZED
    licence: open (Copernicus)
    commercial_use_constraints: none beyond standard Copernicus terms
    registration_required: false
    operational_status_in_ea_forests: operational
    recipe_key: s2-sr-optical-v1
    qa_profile: s2-qa-scl-core/1
    derived_features_in_use: [ndvi, ndmi, nbr]
    derived_features_reserved: [evi, ndre, red_edge_position_proxy, swir_nir_ratios]
    verified: {method: "already in production; 656-CFR national pass, Aug 2026", date: "2026-09-07"}

