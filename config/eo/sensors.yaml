    verified: {method: "EE query: ee.ImageCollection filterBounds(Uganda point) -> non-empty", date: "2026-09-08"}
    notes: >
      Extends optical history before the 2015 Sentinel-2 era. Landsat 8 launched
      2013; combine with Landsat 9 (LC09_C02_T1_L2, same structure, launched 2021)
      for continuity. Spectral bands differ from S2 (fewer, coarser red-edge
      absence) -- cross-sensor differences must be characterized, not assumed away.

