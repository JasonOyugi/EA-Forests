    notes: >
      The oldest usable open L-band epoch (1996) -- valuable for very long
      rotation/disturbance history, not contemporary AGB regression.

  # --- L-band SAR: NISAR (new, high priority) --------------------------------
  - id: nisar-gcov
    mission: NISAR
    sensor: L-SAR (+S-SAR)
    product: GCOV (Geocoded Polarimetric Covariance Matrix)
    processing_level: Radiometrically terrain-corrected backscatter/covariance
    native_support_m: "per ASF product spec, ~sub-pixel to tens of metres depending on product -- confirm exact grid before implementation, not assumed here"
    polarizations: [HH, HV, VH, VV, covariance terms]
    acquisition_geometry_fields: [incidence angle, local geometry, effective number of looks, orbit]
    qa: [per-pixel quality flags per ASF product spec]
    provider: external (NASA Earthdata / ASF DAAC)
    access_method: adapter_only_external
    licence: open (NASA/ISRO, provisional products)
    registration_required: true (NASA Earthdata Login, free)
    operational_status_in_ea_forests: monitoring_release
    verified:
      method: "web search (2026-09-08): NISAR launched 2025-07-30; fully calibrated PROVISIONAL L-band products released for the public starting 2026-06-17 (all L-band acquisitions); Cycle 25 (from 2026-07-08) systematically generates S-Band products for direct download. Global 12-day coverage plan alternates Africa/South America in 6-month blocks."
      caveat: "Provisional status and the exact current Africa acquisition cadence within the active 6-month plan were NOT independently confirmed against a live ASF/Earthdata catalogue query for the Uganda/Tanzania AOI -- treat coverage as likely-available-soon, not confirmed-in-hand, until a real ASF Vertex/CMR search is run for our AOI and date range."
    notes: >
      Highest scientific priority of the new L-band sources given full-power,
      high-resolution polarimetric SAR designed explicitly for structural
      science. Not yet reachable through our existing Earth Engine connection
      -- needs its own ASF/Earthdata adapter. Do not assume decomposition
      labels literally represent forest components.

  # --- L-band SAR: SAOCOM -----------------------------------------------------
  - id: saocom-l1b-l2
