[project]
name = "ea-forests-models-backend"
version = "0.1.0"
description = "Python backend for EA Forests notebook-driven models"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "sqlalchemy>=2.0.43,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.18,<1",
  "earthengine-api>=1.7.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "numpy>=2.3.0",
  "pandas>=2.3.0",
  "pydantic>=2.11.0",
  "requests>=2.32.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL/PostGIS database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
  "/app",
  "/README.md",
  "/pyproject.toml",
  "/alembic.ini",
  "/migrations",
]

[tool.uv]
package = false
